plugins { id 'com.android.application' }
android {
    namespace 'com.gamod.gaemulator'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.gamod.gaemulator'
        minSdk 26
        targetSdk 35
        versionCode = (project.findProperty('gaVersionCode') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0.0'
        testInstrumentationRunner 'com.gamod.gaemulator.SmokeInstrumentation'
        ndk { abiFilters.addAll((project.findProperty('gaAbis') ?: 'arm64-v8a,armeabi-v7a,x86_64').split(',')) }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=none' } }
    }
    signingConfigs { debug { storeFile file('../debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { signingConfig signingConfigs.debug }; release { minifyEnabled false } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/runtimeAssets')
        androidTest.assets.srcDir layout.buildDirectory.dir('generated/testAssets')
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}
tasks.named('preBuild').configure {
    doFirst {
        if (!file('../.deps/miniJVM/minijvm/c/jvm/jit.h').exists() || !file('build/generated/runtimeAssets/runtime/microemu-ios.jar').exists())
            throw new GradleException('Run python android/tools/prepare_assets.py from the repository first.')
    }
}
