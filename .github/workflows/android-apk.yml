name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'ios/java/**'
      - 'ios/native/**'
      - 'ios/tools/**'
      - 'microemulator/microemu-cldc/**'
      - 'microemulator/microemu-midp/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/java/**'
      - 'ios/native/**'
      - 'ios/tools/**'
      - 'microemulator/microemu-cldc/**'
      - 'microemulator/microemu-midp/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare interpreter and runtime assets
        run: |
          python3 -m unittest discover -s ios/tests -p 'test_*.py'
          python3 android/tools/run_host_tests.py
          python3 android/tools/prepare_assets.py
      - name: Build APKs and run Android lint
        run: gradle -p android :app:assembleDebug :app:assembleAndroidTest :app:lintDebug --no-daemon
      - name: Verify packaged native libraries
        run: |
          python3 android/tools/inspect_apk.py android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p android/build/artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android/build/artifacts/GaEmulator-debug.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/build/artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: GaEmulator-Android-APK
          path: android/build/artifacts/GaEmulator-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GaEmulator-Android-Test-APK
          path: android/build/artifacts/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Save Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            android/app/build/reports/
            android/app/.cxx/**/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  interpreter-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: GaEmulator-Android-APK
          path: android/build/artifacts
      - uses: actions/download-artifact@v4
        with:
          name: GaEmulator-Android-Test-APK
          path: android/build/artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the packaged interpreter on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb install -r android/build/artifacts/GaEmulator-debug.apk
            adb install -r android/build/artifacts/app-debug-androidTest.apk
            adb shell am instrument -w com.gamod.gaemulator.test/com.gamod.gaemulator.SmokeInstrumentation | tee android/build/instrumentation.log
            grep -q GA_ANDROID_INSTRUMENTATION_PASS android/build/instrumentation.log
            adb shell run-as com.gamod.gaemulator cat files/runtime.log > android/build/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-interpreter-diagnostics
          path: android/build/*.log
          if-no-files-found: ignore
